<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MS Paint Clone</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      margin: 20px;
    }
    canvas {
      border: 2px solid black;
      cursor: crosshair;
    }
    .toolbar {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button, input[type=range] {
      padding: 8px 16px;
      font-size: 16px;
    }
    label {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="setTool('pencil')">Pencil</button>
    <label for="pencilSizeSlider">Pencil Size:</label>
    <input type="range" id="pencilSizeSlider" min="1" max="50" value="5">

    <button onclick="setTool('eraser')">Eraser</button>
    <label for="eraserSizeSlider">Eraser Size:</label>
    <input type="range" id="eraserSizeSlider" min="1" max="50" value="5">
  </div>
  <canvas id="canvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const pencilSizeSlider = document.getElementById('pencilSizeSlider');
    const eraserSizeSlider = document.getElementById('eraserSizeSlider');

    let tool = 'pencil';
    let pencilSize = parseInt(pencilSizeSlider.value);
    let eraserSize = parseInt(eraserSizeSlider.value);
    let drawing = false;
    let currentStroke = null;
    const strokes = [];

    pencilSizeSlider.addEventListener('input', () => {
      pencilSize = parseInt(pencilSizeSlider.value);
    });

    eraserSizeSlider.addEventListener('input', () => {
      eraserSize = parseInt(eraserSizeSlider.value);
    });

    function setTool(selectedTool) {
      tool = selectedTool;
    }

    canvas.addEventListener('mousedown', (e) => {
      drawing = true;
      const { x, y } = getMousePos(e);
      if (tool === 'pencil') {
        currentStroke = {
          tool: 'pencil',
          size: pencilSize,
          color: 'black',
          points: [{ x, y }]
        };
      } else if (tool === 'eraser') {
        eraseStroke(x, y);
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!drawing) return;
      const { x, y } = getMousePos(e);
      if (tool === 'pencil' && currentStroke) {
        currentStroke.points.push({ x, y });
        redrawCanvas();
      } else if (tool === 'eraser') {
        eraseStroke(x, y);
      }
    });

    canvas.addEventListener('mouseup', () => {
      drawing = false;
      if (tool === 'pencil' && currentStroke) {
        strokes.push(currentStroke);
        currentStroke = null;
      }
    });

    canvas.addEventListener('mouseout', () => {
      drawing = false;
      if (tool === 'pencil' && currentStroke) {
        strokes.push(currentStroke);
        currentStroke = null;
      }
    });

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function redrawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const stroke of strokes) {
        drawStroke(stroke);
      }
      if (currentStroke) drawStroke(currentStroke);
    }

    function drawStroke(stroke) {
      if (stroke.points.length < 2) return;
      ctx.beginPath();
      ctx.lineWidth = stroke.size;
      ctx.strokeStyle = stroke.color;
      ctx.lineCap = 'round';
      ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
      for (let i = 1; i < stroke.points.length; i++) {
        ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
      }
      ctx.stroke();
    }

    function eraseStroke(x, y) {
      for (let i = strokes.length - 1; i >= 0; i--) {
        const stroke = strokes[i];
        for (const point of stroke.points) {
          const dx = point.x - x;
          const dy = point.y - y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist <= eraserSize) {
            strokes.splice(i, 1);
            redrawCanvas();
            return;
          }
        }
      }
    }
  </script>
</body>
</html>
